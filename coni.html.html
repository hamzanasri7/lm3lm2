<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page Template</title>
    <link rel="stylesheet" href="coni.css">
    <!-- Lien pour les icônes (Google) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- En-tête (comme sur l'image) -->
    <header class="top-header">
        <h2>Page d'accueil </h2>
        <p class="discover-link">Rejoinez-nous<span>&darr;</span></p>
        
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html.html">Accueil</a></li>
                <li><a href="prg.html.html">Programmes</a></li>
                <li><a href="Info.html.html">your Coach</a></li>
                <li><a href="coni.html.html">Connexion</a></li>
               
            </ul>
        </nav>
    </header>

    <!-- Conteneur principal (fond rouge) -->
    <main class="main-container">
        
        <!-- Carte de connexion -->
        <div class="login-card">
            
            <!-- Partie Gauche : Formulaire -->
            <div class="form-section">
                <h1>WELCOME BACK</h1>
                <p class="subtitle">Welcome back! Please enter your details.</p>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="**********" required>
                            <!-- Icône pour afficher/masquer le mot de passe -->
                            <i class="fa-regular fa-eye" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign in</button>
                    
                    <button type="button" class="btn-google">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
                        Sign in with Google
                    </button>
                </form>

                <p class="signup-text">
                    Don't have an account? <a href="#">Sign up for free!</a>
                </p>
            </div>

            <!-- Partie Droite : Illustration -->
            <div class="image-section">
                <!-- J'utilise une image de substitution, vous pouvez mettre votre propre image de basketteur -->
                <img src="IMG_3686.jpg" alt="gym">
            </div>

        </div>
    </main>

    <script src="coni.js"></script>
</body>
</html>
